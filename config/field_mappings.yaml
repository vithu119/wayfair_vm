  - wayfair_field: "Finish"
    aliases: [finish, colour, color, surface_finish, metal_finish]
    categories: ["Chandeliers", "Flush Mount Lighting", "Table Lamps", "Wall Sconces", "Pendant Lightt", "Pendant Light Listing"]

  - wayfair_field: "Fixture Material"
    aliases: [fixture_material, material, body_material, frame_material]
    categories: ["Chandeliers", "Flush Mount Lighting", "Table Lamps", "Wall Sconces", "Pendant Lightt", "Pendant Light Listing"]

  - wayfair_field: "Overall Shape"
    aliases: [shape, overall_shape, fixture_shape, body_shape]
    categories: ["Chandeliers", "Flush Mount Lighting", "Table Lamps", "Wall Sconces", "Pendant Lightt", "Pendant Light Listing"]

  - wayfair_field: "Power Source"
    aliases: [power_source, connection_type, power_type]
    categories: ["Chandeliers", "Flush Mount Lighting", "Table Lamps", "Wall Sconces", "Pendant Lightt", "Pendant Light Listing"]

  - wayfair_field: "IP Rating"
