  - wayfair_field: "Document Type 2"
    aliases: [document_type_2, doc_type_2]
    categories: ["all"]

  # ── Physical Attributes ───────────────────────────────────────────────────

  - wayfair_field: "Overall Height - Top to Bottom"
    aliases: [height, overall_height, product_height, item_height, height_mm, h]
    categories: ["all"]
    transform: number

  - wayfair_field: "Overall Width - Side to Side"
    aliases: [width, overall_width, product_width, item_width, width_mm, w]
    categories: ["all"]
    transform: number

  - wayfair_field: "Overall Depth - Front to Back"
    aliases: [depth, overall_depth, product_depth, item_depth, depth_mm, d]
    categories: ["all"]
    transform: number

  - wayfair_field: "Overall Product Weight"
    aliases: [overall_weight, gross_product_weight]
    categories: ["all"]
    transform: number

  # ── Lighting-Specific ─────────────────────────────────────────────────────

  - wayfair_field: "Number of Lights"
    aliases: [num_lights, number_of_lights, light_count, bulb_count, num_bulbs]
    categories: ["Chandeliers", "Flush Mount Lighting", "Table Lamps", "Wall Sconces", "Pendant Lightt", "Pendant Light Listing"]

  - wayfair_field: "Bulb / Light Type"
    aliases: [bulb_type, light_type, lamp_type, bulb_light_type]
