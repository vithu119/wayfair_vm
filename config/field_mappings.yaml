    categories: ["Chandeliers", "Flush Mount Lighting", "Table Lamps", "Lampshades"]

  - wayfair_field: "Shade Colour"
    aliases: [shade_colour, shade_color, shade_finish]
    categories: ["Chandeliers", "Flush Mount Lighting", "Table Lamps", "Lampshades"]

  # ── Lampshades-Specific ───────────────────────────────────────────────────

  - wayfair_field: "Material"
    aliases: [material, fabric, lamp_material]
    categories: ["Lampshades"]

  - wayfair_field: "Colour"
    aliases: [colour, color, primary_colour]
