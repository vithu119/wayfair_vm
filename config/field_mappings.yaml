  - wayfair_field: "Colour Temperature"
    aliases: [colour_temperature, color_temperature, cct, kelvin, colour_temp]
    categories: ["Chandeliers", "Flush Mount Lighting", "Table Lamps", "Wall Sconces", "Pendant Lightt", "Pendant Light Listing", "Light Bulbs"]
