  # ── Images & Media ────────────────────────────────────────────────────────

  - wayfair_field: "Image File Name or URL 1"
    aliases: [image_1, image_url_1, main_image, primary_image, image_url, image_file_1]
    categories: ["all"]
    required: true

  - wayfair_field: "Image File Name or URL 2"
    aliases: [image_2, image_url_2, alt_image_1, secondary_image, image_file_2]
    categories: ["all"]

  - wayfair_field: "Image File Name or URL 3"
    aliases: [image_3, image_url_3, alt_image_2, image_file_3]
    categories: ["all"]

  - wayfair_field: "Image File Name or URL 4"
    aliases: [image_4, image_url_4, alt_image_3, image_file_4]
    categories: ["all"]

  - wayfair_field: "Image File Name or URL 5"
    aliases: [image_5, image_url_5, alt_image_4, image_file_5]
    categories: ["all"]

  - wayfair_field: "Video File Name or URL 1"
    aliases: [video_1, video_url_1, video_url, video_file]
    categories: ["all"]

  # ── Documents ─────────────────────────────────────────────────────────────

  - wayfair_field: "Document File Name or URL 1"
    aliases: [document_1, doc_url_1, document_url_1, spec_sheet_url, datasheet_url]
