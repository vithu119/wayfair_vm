# Wayfair Auto-Fill Field Mappings
# =================================
# Each entry maps one or more source column names (aliases) to an exact
# Wayfair template header.  The engine tries each alias in order and uses the
# first one found in the source row.
#
# Fields:
#   wayfair_field   - exact header text from the Wayfair template (case-sensitive)
#   aliases         - list of source column names (case-insensitive match)
#   categories      - ["all"] or a list of category names this mapping applies to
#   transform       - optional transformation (see transformation_rules.yaml)
#   fixed_value     - write this value regardless of source data
#   default_value   - use this when source column is present but empty
#   required        - emit a warning in the fill report if still empty after mapping
#   notes           - human-readable context

mappings:

  # ── Identity / Catalogue ─────────────────────────────────────────────────

  - wayfair_field: "Supplier Part Number"
    aliases: [sku, part_number, supplier_part_number, item_number, style_number, product_code]
    categories: ["all"]
    required: true

  - wayfair_field: "Amazon Seller SKU"
    aliases: [amazon_sku, asin, amazon_seller_sku, amz_sku]
    categories: ["all"]

  - wayfair_field: "European Article Number"
    aliases: [ean, ean13, barcode, ean_barcode, gtin, upc]
    categories: ["all"]

  - wayfair_field: "Brand"
    aliases: [brand, manufacturer, brand_name]
    categories: ["all"]
    required: true

  - wayfair_field: "Manufacturer Part Number"
    aliases: [mpn, manufacturer_part_number, mfr_part_number, model_number, model_no, sku, supplier_part_number]
    categories: ["all"]
    required: true
    transform: "prefix:WF-"

  - wayfair_field: "Product Name"
    aliases: [product_name, title, name, product_title, item_name]
    categories: ["all"]
    transform: truncate:500
    required: true

  - wayfair_field: "Collection Name"
    aliases: [collection, collection_name, series, range_name, line_name]
    categories: ["all"]

  - wayfair_field: "Manufacturer Product URL"
    aliases: [product_url, manufacturer_url, product_link, item_url]
    categories: ["all"]

  - wayfair_field: "Group Reference ID"
    aliases: [group_id, group_reference_id, variant_group_id, parent_sku]
    categories: ["all"]

  # ── Variant ───────────────────────────────────────────────────────────────

  - wayfair_field: "Variant Type"
    aliases: [variant_type]
    categories: ["all"]

  - wayfair_field: "Variant Grouping 1"
    aliases: [variant_grouping_1, variant_group_1]
    categories: ["all"]

  - wayfair_field: "Variant Attribute Name On Site 1"
    aliases: [variant_attribute_1, variant_value_1, variant_name_1]
    categories: ["all"]

  - wayfair_field: "Variant Grouping 2"
    aliases: [variant_grouping_2, variant_group_2]
    categories: ["all"]

  - wayfair_field: "Variant Attribute Name On Site 2"
    aliases: [variant_attribute_2, variant_value_2, variant_name_2]
    categories: ["all"]

  - wayfair_field: "Variant Grouping 3"
    aliases: [variant_grouping_3, variant_group_3]
    categories: ["all"]

  - wayfair_field: "Variant Attribute Name On Site 3"
    aliases: [variant_attribute_3, variant_value_3, variant_name_3]
    categories: ["all"]

  # ── Pricing ───────────────────────────────────────────────────────────────

  - wayfair_field: "Base Cost"
    aliases: [cost, base_cost, __base_cost__, wholesale_price, buy_price, net_price, trade_price]
    categories: ["all"]
    transform: number
    required: true

  - wayfair_field: "Manufacturer Suggested Retail Price"
    aliases: [msrp, rrp, retail_price, recommended_retail_price, list_price]
    categories: ["all"]
    transform: number

  - wayfair_field: "Everyday B2B Discount Rate"
    aliases: [b2b_discount, trade_discount, b2b_discount_rate]
    categories: ["all"]
    transform: number

  # ── Marketing Content ─────────────────────────────────────────────────────

  - wayfair_field: "Marketing Copy"
    aliases: [description, marketing_copy, product_description, long_description, copy, amazon_description, item_description]
    categories: ["all"]
    transform: marketing_copy

  - wayfair_field: "Feature Bullet 1"
    aliases: [bullet_1, feature_1, feature_bullet_1, bullet_point_1]
    categories: ["all"]
    transform: truncate:500

  - wayfair_field: "Feature Bullet 2"
    aliases: [bullet_2, feature_2, feature_bullet_2, bullet_point_2]
    categories: ["all"]
    transform: truncate:500

  - wayfair_field: "Feature Bullet 3"
    aliases: [bullet_3, feature_3, feature_bullet_3, bullet_point_3]
    categories: ["all"]
    transform: truncate:500

  - wayfair_field: "Feature Bullet 4"
    aliases: [bullet_4, feature_4, feature_bullet_4, bullet_point_4]
    categories: ["all"]
    transform: truncate:500

  - wayfair_field: "Feature Bullet 5"
    aliases: [bullet_5, feature_5, feature_bullet_5, bullet_point_5]
    categories: ["all"]
    transform: truncate:500

  # ── Order Quantities ──────────────────────────────────────────────────────

  - wayfair_field: "Minimum Order Quantity"
    aliases: [moq, min_qty, minimum_order_quantity, min_order_qty]
    categories: ["all"]
    transform: integer
    default_value: "1"

  - wayfair_field: "Force Quantity Multiplier"
    aliases: [qty_multiplier, force_quantity_multiplier, quantity_multiplier]
    categories: ["all"]
    transform: integer
    default_value: "1"

  - wayfair_field: "Display Set Quantity"
    aliases: [set_quantity, display_set_quantity, set_qty, pieces_per_set]
    categories: ["all"]
    transform: integer
    default_value: "1"

  # ── Weight & Shipping ─────────────────────────────────────────────────────

  - wayfair_field: "Product Weight"
    aliases: [weight, product_weight, net_weight, item_weight, weight_g]
    categories: ["all"]
    transform: g_to_kg
    required: true

  - wayfair_field: "Lead Time"
    aliases: [lead_time, dispatch_days, lead_time_days]
    categories: ["all"]

  - wayfair_field: "Replacement Lead Time"
    aliases: [replacement_lead_time, restock_lead_time, re_order_lead_time]
    categories: ["all"]

  - wayfair_field: "Flat Pack"
    aliases: [flat_pack, flat_packed, flat_pack_yn]
    categories: ["all"]
    transform: yes_no

  - wayfair_field: "Ship Palletized"
    aliases: [ship_palletized, palletized, pallet_shipped]
    categories: ["all"]
    transform: yes_no

  # ── Carton Dimensions ─────────────────────────────────────────────────────

  - wayfair_field: "Carton Weight 1"
    aliases: [carton_weight, carton_weight_1, box_weight, gross_weight, shipping_weight]
    categories: ["all"]
    transform: number
    required: true

  - wayfair_field: "Carton Height 1"
    aliases: [carton_height, carton_height_1, carton_h, box_height, shipping_height]
    categories: ["all"]
    transform: number
    required: true

  - wayfair_field: "Carton Width 1"
    aliases: [carton_width, carton_width_1, carton_w, box_width, shipping_width]
